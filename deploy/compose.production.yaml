name: ${COMPOSE_PROJECT_NAME:-minmd-prod}
x-app-environment: &app-environment
  APP_ENV: production
  HOST: 0.0.0.0
  PORT: "9811"
  DOC_COLLAB_MESSAGES_PER_SECOND: ${DOC_COLLAB_MESSAGES_PER_SECOND:-100}
  AI_EXECUTION_TIMEOUT_MS: ${AI_EXECUTION_TIMEOUT_MS:-15000}
  HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-16777216}
  DATABASE_URL: postgresql://minmd:${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-minmd}
  HTTP_IP_DIRECT: "false"
  AUTH_TRANSPORT: cookie
  AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请设置实际访问来源}
  APP_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请设置实际访问来源}
  APP_DEV_ORIGINS: ""
  APP_REGISTRATION_ENABLED: "false"
  CORS_ORIGINS: ""
  TRUST_PROXY_ADDRESSES: ${TRUST_PROXY_ADDRESSES:-}
  API_DEBUG_ENABLED: "false"
  ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置首次管理员密码}
  WEB_CMS_PATH: /admin
  WEB_CMS_DIST: /app/dist/web-cms
  WEB_DIST: /app/dist/web
  STATIC_DIR: /app/runtime/public
  STATIC_PATH: /public
  AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:-}
  ASSET_STORAGE_DIR: /var/lib/minmd/assets
  ASSET_UNBOUND_GRACE_HOURS: ${ASSET_UNBOUND_GRACE_HOURS:-24}
  DOC_COLLAB_VERIFY_ENABLED: "false"
  SHEET_COLLAB_VERIFY_ENABLED: "false"
  DOC_COLLAB_MAX_SESSIONS: ${DOC_COLLAB_MAX_SESSIONS:-10}
  SHEET_COLLAB_MAX_SESSIONS: ${SHEET_COLLAB_MAX_SESSIONS:-10}
  LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  postgres:
    image: postgres:18
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}
    environment:
      POSTGRES_USER: minmd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-minmd}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: ${MINMD_IMAGE_PREFIX:-minmd}-migrate:${MINMD_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/Dockerfile, target: migrate }
    profiles: [tools]
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}
    environment:
      <<: *app-environment
      WEB_CMS_DIST: /workspace/dist/web-cms
      WEB_DIST: /workspace/dist/web
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  app:
    image: ${MINMD_IMAGE_PREFIX:-minmd}-app:${MINMD_IMAGE_TAG:-local}
    build: { context: .., dockerfile: deploy/Dockerfile, target: app }
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}
    environment: *app-environment
    volumes:
      - asset_data:/var/lib/minmd/assets
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          'const response=await fetch("http://127.0.0.1:9811/api/health");process.exit(response.ok?0:1)',
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  postgres_data:
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}
  asset_data:
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}

networks:
  default:
    labels:
      io.minmd.installation: ${MINMD_INSTALLATION_ID:-manual}
