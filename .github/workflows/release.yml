name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "待发布版本，例如 v0.1.4；必须与所选分支 package.json 一致"
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: minmd-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: 配置 Gitee 仓库认证
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
        run: |
          test -n "$GITEE_TOKEN" && test -n "$GITEE_USERNAME" || { echo '请配置 GITEE_TOKEN 和 GITEE_USERNAME Secrets'; exit 1; }
          git remote add gitee https://gitee.com/tingxi8087/minmd.git
          cat > "$RUNNER_TEMP/gitee-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' "$GITEE_USERNAME" ;; *Password*) printf '%s\n' "$GITEE_TOKEN" ;; *) exit 1 ;; esac
          SH
          chmod 700 "$RUNNER_TEMP/gitee-askpass.sh"
      - name: 使用与本机相同的一键发布入口
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GIT_ASKPASS: ${{ runner.temp }}/gitee-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: bun run release "$RELEASE_VERSION"
