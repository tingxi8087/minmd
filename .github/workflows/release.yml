name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: minmd
          POSTGRES_PASSWORD: ci-minmd-test-only
          POSTGRES_DB: minmd_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minmd -d minmd_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://minmd:ci-minmd-test-only@127.0.0.1:5432/minmd_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run db:migrate
      - run: bun run test:integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: bun test tests/sheet-business-collab.test.ts
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: bun test tests/runtime-process.test.ts
        env:
          RUNTIME_PROCESS_TEST: "true"
      - run: docker build -f deploy/Dockerfile --target app -t minmd-release-test-app:local .
      - run: docker build -f deploy/Dockerfile --target migrate -t minmd-release-test-migrate:local .
      - run: bun test tests/deploy-runtime.test.ts
        timeout-minutes: 15
        env:
          DEPLOY_RUNTIME_TEST: "true"
          DEPLOY_APP_IMAGE: minmd-release-test-app:local
          DEPLOY_MIGRATE_IMAGE: minmd-release-test-migrate:local
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, migrate]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          printf 'prefix=ghcr.io/%s\n' "$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.prefix }}-${{ matrix.target }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
  bundle:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          # 正式安装包只在匿名访问镜像通过后发布。首次发布需在 GHCR 将两个包设为 Public。
          docker manifest inspect "$PREFIX-app:$VERSION" >/dev/null
          docker manifest inspect "$PREFIX-migrate:$VERSION" >/dev/null
          sh deploy/scripts/package-release.sh "$PREFIX" "$VERSION" "dist/minmd-$VERSION.tar.gz"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "MinMD $VERSION" --notes '下载部署包，解压后执行 ./minmd.sh install。支持已有反代、自动 HTTPS 和 IP 直连三种模式。'
          fi
          gh release upload "$VERSION" "dist/minmd-$VERSION.tar.gz" "dist/minmd-$VERSION.tar.gz.sha256" --clobber
