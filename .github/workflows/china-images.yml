name: China images
on:
  workflow_dispatch:
    inputs:
      version:
        description: "已发布的固定版本，例如 v0.1.0"
        required: true
        default: v0.1.0
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: china-images-${{ inputs.version || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.TCR_NAMESPACE != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # 个人版有推拉并发配额，按仓库串行复制。
      max-parallel: 1
      matrix:
        target: [app, migrate, postgres, caddy]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: 同步已发布镜像并验证公开双架构拉取
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
          NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TARGET: ${{ matrix.target }}
        run: sh deploy/scripts/mirror-images.sh "$REPOSITORY" "$VERSION" "$NAMESPACE" "$TARGET"
