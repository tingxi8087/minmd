# 私有附件不挂载至Nginx，统一经过/api鉴权。
map $http_upgrade $minmd_connection {
  default upgrade;
  '' close;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # 仅信任宿主TLS代理进入Docker桥的指定地址，清理外来伪造XFF。
  set_real_ip_from ${MINMD_PROXY_GATEWAY};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # 视频上传上限200MiB；额外1MiB留给multipart边界，其他文件由应用分别限制。
  client_max_body_size 201m;
  client_body_timeout 60s;

  location = /nginx-health { access_log off; return 200 'ok\n'; }
  location = /admin { return 308 /admin/; }
  location /admin/ { try_files $uri $uri/ =404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }

  # 两类协作房间都由单实例app接收；保留Upgrade及长连接。
  location /api/ {
    access_log off;
    proxy_pass http://app:9811;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $minmd_connection;
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
  # MCP Streamable HTTP需要关闭响应缓冲，不能按普通静态页面处理。
  location = /mcp {
    access_log off;
    proxy_pass http://app:9811;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
