name: Demo Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "shared/**"
      - "config/dev.ts"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "docs/images/workspace.jpg"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
concurrency:
  group: demo-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web test:ui
      - run: bun run build:demo
      - run: cp LICENSE THIRD_PARTY_NOTICES.txt dist/demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
